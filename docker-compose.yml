name: Onlinecomic

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in BackEnd/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in BackEnd/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in BackEnd/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./BackEnd
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./BackEnd/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in BackEnd/.env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in BackEnd/.env}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./BackEnd/public/uploads:/app/public/uploads
    command: ["sh", "-c", "npm run prisma:deploy && npx prisma db seed && npm run start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: ./FrontEnd
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
